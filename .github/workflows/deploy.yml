name: Deploy to Firebase

on:
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

jobs:
  check-date:
    name: Check if First Tuesday
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.date.outputs.should_run }}
    steps:
      - id: date
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            day=$(date +%d)
            # Since cron runs every Tuesday, checking if day is <= 7 guarantees it's the FIRST Tuesday
            if [ $day -le 7 ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build_and_deploy:
    needs: check-date
    if: needs.check-date.outputs.should_run == 'true'
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
