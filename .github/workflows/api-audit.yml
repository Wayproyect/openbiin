name: API Autonomous Audit

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  audit-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Run API Audit Script
        env:
          BIN_API_HOST: ${{ secrets.BIN_API_HOST }}
          BIN_API_KEY: ${{ secrets.BIN_API_KEY }}
        run: node scripts/api_audit.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add functions/data/*.csv audit.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(data): automated bin data audit via internal API"
            git push
          else
            echo "No changes to commit"
          fi
